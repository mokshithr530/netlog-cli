[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netlog-cli"
version = "1.1.0"
description = "High-performance CLI network telemetry dashboard tracking socket states, live bandwidth rates, and async DNS."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Mokshith Reddy", email = "mokshithr530@gmail.com" }
]
keywords = ["networking", "cli", "telemetry", "traffic-monitor", "linux", "tui", "bandwidth"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
netlog = "netlog.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["netlog*"]
